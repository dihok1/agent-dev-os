name: 🐛 Bug report
description: Something broken in the template
labels: bug
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: cursor
    attributes:
      label: Cursor version
  - type: textarea
    id: extra
    attributes:
      label: Additional context
