name: PR Check
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  pr-metadata:
    name: PR metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check PR links active change
        run: |
          BODY="${{ github.event.pull_request.body }}"
          if echo "$BODY" | grep -qiE 'changes/|## Change'; then
            echo "✓ PR references a Change"
          else
            echo "::warning::PR body should reference active Change (changes/<slug>)"
          fi

